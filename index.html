<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academy — courses you build</title>
<meta name="description" content="Build a course from a topic, your files or your notes — then read it, drill it and keep notes on it.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css?v=3.2.1">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="brand" data-nav="home" type="button">
      <span class="brand-mark">◈</span>
      <span class="brand-text">Academy</span>
    </button>

    <nav class="tabs" role="tablist">
      <button class="tab" data-nav="library" type="button">Courses</button>
      <button class="tab" data-nav="home" type="button">Overview</button>
      <button class="tab" data-nav="syllabus" type="button">Syllabus</button>
      <button class="tab" data-nav="quiz" type="button">Quiz</button>
      <button class="tab" data-nav="glossary" type="button">Glossary</button>
      <button class="tab" data-nav="cards" type="button">Cards</button>
      <button class="tab" data-nav="notes" type="button">Notes</button>
      <button class="tab" data-nav="progress" type="button">Progress</button>
    </nav>

    <div class="hud">
      <button class="who coursechip" id="coursechip" type="button" title="Switch course">
        <span class="who-av" id="course-ic">◈</span><span class="who-name" id="course-nm">Course</span>
      </button>
      <span class="hud-item hud-streak" title="Day streak"><i>🔥</i><b id="hud-streak">0</b></span>
      <span class="hud-item hud-xp" title="Total XP"><i>◆</i><b id="hud-xp">0</b></span>
      <span class="hud-item hud-hearts" title="Hearts"><i>♥</i><b id="hud-hearts">5</b></span>
      <button class="who" id="who" type="button" title="Switch profile">
        <span class="who-av" id="who-av">◈</span><span class="who-name" id="who-name">You</span>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <span>Content current to <b>August 2026</b>. Figures are point-in-time — see <a href="sources.md">sources</a>.</span>
    <span class="foot-sep">·</span>
    <span>Not investment advice.</span>
  </footer>
</div>

<button id="notefab" class="notefab" type="button" title="Notes (Cmd/Ctrl + J)">
  <span>📝</span><b>Notes</b>
</button>

<aside id="drawer" class="drawer" aria-label="Notes" hidden>
  <div class="drawer-head">
    <strong class="drawer-title">Notes</strong>
    <select id="dw-page" class="dw-select" aria-label="Choose a note"></select>
    <button id="dw-new" class="btn btn-sm btn-ghost" type="button">+ New</button>
    <a id="dw-open" class="btn btn-sm btn-ghost" href="#/notes">Expand</a>
    <button id="dw-close" class="dw-x" type="button" aria-label="Close">×</button>
  </div>
  <div id="dw-body" class="drawer-body"></div>
</aside>
<div id="drawer-scrim" class="drawer-scrim" hidden></div>

<div id="toast" class="toast" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>

<script src="assets/js/data/curriculum.js?v=3.2.1"></script>
<script src="assets/js/data/questions.js?v=3.2.1"></script>
<script src="assets/js/data/glossary.js?v=3.2.1"></script>
<!-- Bundled courses: one file each, written into the repo so they appear on
     every device. Add a line here when you add a course file. -->
<script src="assets/js/data/courses/transaction-banking.js?v=3.2.1"></script>
<script src="assets/js/data/courses/cloud-basics.js?v=3.2.1"></script>
<!-- <script src="assets/js/data/courses/your-course.js?v=3.2.1"></script> -->
<script src="assets/js/courses.js?v=3.2.1"></script>
<script src="assets/js/store.js?v=3.2.1"></script>
<script src="assets/js/notes.js?v=3.2.1"></script>
<script src="assets/js/builder.js?v=3.2.1"></script>
<script src="assets/js/annotate.js?v=3.2.1"></script>
<script src="assets/js/app.js?v=3.2.1"></script>
</body>
</html>
